  <p>这页从电商站移到研究院。</p>
  <h1>证据分级</h1>
  <p>每项主张都从证据质量谈起。等级说明研究能够支持多大把握，以及不确定性在哪里。等级说的是证据强度，不代表题目重不重要，也不是诊断。</p>
  <h2>A · 强</h2>
  <p>有重复验证的荟萃分析、随机对照试验或大型队列研究。报告效应大小，而不是只说“研究表明”。</p>
  <h2>B · 中等</h2>
  <p>规模较小或观察性研究，以及一致的临床共识。可以参考，但要写明局限。</p>
  <h2>C · 初步</h2>
  <p>社区经验、个案研究，或看起来说得通的机制。会标明，也不拿 C 级证据当作推荐依据。</p>
